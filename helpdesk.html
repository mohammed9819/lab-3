<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="description" content="CWA Help Desk Appointment">
    <meta name="keywords" content="CWA, Help Desk, Appointment">
    <meta name="author" content="Your Name">

    <title>CWA Help Desk Appointment</title>
</head>

<body>


<a href="http://www.swin.edu.au">
<img src="logo.png" alt="CWA logo">
</a>
<h1> CWA Help Desk Appointment</h1>
<p> The Help desk is located in ATC620. Open 10:30 to 19:00 Monday To Friday</p>
<p>Check Blackboard for when CWA tutors will be there. </p>
<form>
<!-- Student Details -->
<fieldset>
<legend>Student Details</legend>
<label for="studentid">Student ID:</label>
<input type="text" id="studentid" name="studentid" pattern="[0-9]{7,10}" required>
<p>

</p>
<label for="givenname">Given Name</label>
<input 
type="text" id="givenname" name="givenname" maxlength="15" pattern="[A-Za-z]+" required >

<label for="familyname">Family Name</label>
<input 
type="text" id="familyname" name="familyname" maxlength="15" pattern="[A-Za-z]+" required>
</fieldset>

<fieldset>

<legend>Your unit</legend>
<input type="radio" id="cos10011" name="unit" value="COS10011" required>
<label for="cos10011">COS10011</label>
<input type="radio" id="cos60004" name="unit" value="COS60004">
<label for="cos60004">COS60004</label>
<input type="radio" id="cos60007" name="unit" value="COS60007">
<label for="cos60007">COS60007</label>
<label for="tutor">Your Tutor</label>
<select id="tutor" name="tutor" required>
<option value="">Please Select</option>
<option value="hamada">hamada</option>
<option value="afnan">afnan</option>
<option value="khalid">khalid</option>
</select>
</fieldset>

<fieldset>
<legend>Issue</legend>
<input type="checkbox" id="html" name="issue[]" value="HTML" checked="checked">
<label for="html">HTML</label>
<input type="checkbox" id="css" name="issue[]" value="CSS">
<label for="css">CSS</label>
<input type="checkbox" id="javascript" name="issue[]" value="JavaScript">
<label for="javascript">JavaScript</label>
<input type="checkbox" id="php" name="issue[]" value="PHP">
 <label for="php">PHP</label>

<input type="checkbox" id="mysql" name="issue[]" value="MySQL">
<label for="mysql">MySQL</label>

<br><br>

<label for="description">Description of Issue</label>
<br>
<textarea
id="description"
name="description"
rows="5"
cols="40"
placeholder="Write description of your problem here..."
></textarea>
</fieldset>
<fieldset>
<legend>Preferred Date / Time</legend>
<label for="date">Date</label>
<input
type="text"
id="date"
name="date"
placeholder="dd/mm/yyyy"
pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
required>
<br>
<label for="time">Time</label>
<input
type="text"
id="time"
name="time"
placeholder="00:00"
pattern="[0-9]{2}:[0-9]{2}"
required>
</fieldset>

<br>

<input type="submit" value="Book">
<input type="reset" value="Reset form">
</form>

</body>
</html>
